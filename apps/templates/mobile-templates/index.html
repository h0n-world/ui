<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="/favicon.ico" />

        <meta name="google" content="notranslate" />
        <meta name="theme-color" content="#000000" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta content="Mobile Templates" name="apple-mobile-web-app-title" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />

        <meta
            name="viewport"
            content="width=device-width,minimum-scale=1,maximum-scale=1,user-scalable=no,shrink-to-fit=no,viewport-fit=cover"
        />

        <title>Mobile Templates</title>
    </head>
    <body>
        <div id="app"></div>

        <script type="text/javascript">
            function reloadWithParam() {
                try {
                    var url = new URL(window.location.href)
                    var timestamp = new Date().getTime()
                    url.searchParams.set('t', timestamp)
                    window.location.href = url.toString()
                } catch (e) {
                    window.location.reload()
                }
            }

            window.onerror = function (message, source, lineno, colno, error) {
                if (
                    message &&
                    (message.includes('Failed to fetch') ||
                        message.includes('MIME type') ||
                        message.includes('Loading chunk'))
                ) {
                    reloadWithParam()
                }
            }
        </script>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
